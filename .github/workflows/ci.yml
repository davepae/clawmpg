name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Unit and suite-integrity tests
        run: python -m pytest -q
      - name: Mock end-to-end benchmark
        run: python -m oer run --adapter mock --out /tmp/mock.json
      - name: Validate result against schema
        run: python -m oer validate /tmp/mock.json
      - name: Build leaderboard from synthetic result
        run: python -m oer leaderboard /tmp/mock.json --include-synthetic --out-dir /tmp/lb
